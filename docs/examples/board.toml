# ~/.config/ephor/board.toml — the board's lanes, and the flows that act on it.
#
# Full reference: docs/flows.md. Check a change with `ephor flows check`, and
# preview what the flows would do with `ephor flows tick --dry-run`.
#
# Needs EPHOR_JIRA_URL / EPHOR_JIRA_EMAIL / EPHOR_JIRA_TOKEN. Nothing here
# writes to Jira.

[board]
# Projects the search is scoped to (default: $EPHOR_TICKET_PROJECTS).
projects = ["DR"]
# Which tickets are on the board. ANDed with the project scope.
jql = "assignee = currentUser() AND (statusCategory != Done OR updated >= -7d)"
# The lanes, in order. A name, or a table: the statuses it gathers, plus
# optional limits the lane is drawn against (nothing is blocked on them):
#   wip          how many tickets the lane should hold at most
#   warn_after   a ticket in the lane this long is drawn as ageing
#   alert_after  ... and this long, as stuck
# A status no column claims goes by its Jira category: done → the last
# column, to-do → the first, anything else → an "Other" lane.
columns = [
  "To Do",
  { name = "In Progress", statuses = ["In Progress"], wip = 3, warn_after = "3d" },
  { name = "Review", statuses = ["Peer Review", "QA"], wip = 4, warn_after = "36h", alert_after = "3d" },
  "Done",
]

[repos]
# Where a project's flows run when the ticket has no worktree of its own.
DR = "~/projects/work/aim-myt"

[flows]
tmux_session = ""          # "" = the current tmux session; set it for a systemd timer
max_active_agents = 4      # agent slots: sessions still at work; more approved runs queue
max_runs_per_hour = 6      # agent (start =) launches across all flows, per hour
ticket_breaker = 3         # agent launches per ticket per hour
max_commands_per_hour = 60 # command = launches per hour (a separate budget)
max_event_age = "30m"      # after a longer gap every new run waits for confirmation
confirm_ttl = "24h"        # unanswered runs expire
queue_ttl = "3d"           # a run queued for a slot this long expires
pr_interval = "5m"         # spacing of the `gh` lookups behind on_pr
settle = "10m"             # how long a session must sit idle for on_session = "idle"

# Offer a review session when one of your tickets lands in Peer Review.
# Agent flows (start =) are always confirm-only: approve with `f` then `y`
# in the dashboard, or `ephor flows approve DR-1234.review`.
[[flow]]
name = "review"
on_enter = "Peer Review"
start = "/review-pr {ticket}"
worktree = false           # run in the ticket's worktree, else the repo root

# Hand implementation off to a review as soon as a PR is opened. Waits
# (blocked) until the session that opened the PR has finished, or has sat
# idle for longer than `settle`.
[[flow]]
name = "self-review"
on_pr = "opened"
start = "/review-pr {ticket}"

# Conditions: `from` (on_enter only) limits a rule to moves out of the named
# status(es); `jql` adds a Jira condition the ticket must also meet (checked
# with one search per tick that has candidates); `repo` runs the flow in a
# checkout of its own. Placeholders beyond {ticket} {title} {status}:
# {from_status} {pr_url} {pr_number} {repo} {session_id} — "" when unknown.
[[flow]]
name = "qa-ping"
on_enter = "QA"
from = ["Peer Review"]
jql = "labels = needs-qa"
command = "~/.config/ephor/flows/qa-ping.sh {ticket} {from_status}"
mode = "auto"

# Run a script, unattended, when a PR merges. It reads $EPHOR_FLOW_PAYLOAD.
[[flow]]
name = "shipped"
on_pr = "merged"
command = "~/.config/ephor/flows/shipped.sh {ticket}"
mode = "auto"

# Hear about an agent that died mid-task.
[[flow]]
name = "died"
on_session = "died"
command = "notify-send ephor {ticket}"
mode = "auto"
